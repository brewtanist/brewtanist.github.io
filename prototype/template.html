<script>
'use strict';
(() => {
const DEFAULT = JSON.parse(document.getElementById('seed').textContent);
const STORE = 'brewtanist-preview-lab-v1';
const clone = x => JSON.parse(JSON.stringify(x));
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
let data = clone(DEFAULT), selected = new Set(), filter = 'all', search = '', quiz = {step:0, answers:[]}, editorId = DEFAULT.products[0].id, toastTimer;
let persistence = true;
const labels = {all:'ทั้งหมด',chocolate:'ช็อกโกแลต / ถั่ว',sweet:'วานิลลา / รัมเรซิน',fruity:'ดอกไม้ / ผลไม้',beans:'เมล็ดกาแฟ',capsules:'แคปซูล',drip:'Drip Bag',black:'กาแฟดำ',milk:'กาแฟนม',unsure:'ยังไม่แน่ใจ'};
const allowedIds = new Set(DEFAULT.products.map(p=>p.id));
const safeProductUrl = value => {
  if (!value) return '';
  try { const u = new URL(value); return u.protocol === 'https:' && u.hostname === 'shopee.co.th' && !u.username && !u.password ? u.href : ''; } catch { return ''; }
};
function checked(raw) {
  if (!raw || raw.schemaVersion !== 1 || !Array.isArray(raw.products) || raw.products.length !== DEFAULT.products.length) throw new Error('รูปแบบไฟล์ไม่ตรงกับต้นแบบรุ่นนี้');
  const d = clone(DEFAULT), seen = new Set();
  for (const k of ['title','intro']) { if (typeof raw[k] !== 'string' || raw[k].length > 2000) throw new Error('ข้อความหน้าแรกไม่ถูกต้อง'); d[k] = raw[k]; }
  d.products = raw.products.map(p => {
    if (!p || !allowedIds.has(p.id) || seen.has(p.id)) throw new Error('รายการสินค้าหรือรหัสสินค้าซ้ำ/ไม่ถูกต้อง');
    seen.add(p.id);
    const out = clone(DEFAULT.products.find(x=>x.id===p.id));
    for (const k of ['name','profile','notes','description','alt','price','sizes','grinding','origin','productUrl']) {
      if (typeof p[k] !== 'string' || p[k].length > 5000) throw new Error('ข้อมูลสินค้าไม่ถูกต้อง: '+k);
      out[k] = p[k];
    }
    if (!out.name.trim() || !out.alt.trim()) throw new Error('ต้องมีชื่อสินค้าและคำอธิบายรูป');

function renderValidation() {
 const node=$('#validation'); if(!node)return; const v=validation();
 node.innerHTML=`<b>ตรวจความพร้อมก่อนเผยแพร่จริง</b><p class="small" style="margin-top:8px">${v.errors.length?'มีข้อมูลที่ต้องแก้':'รูปแบบข้อมูลถูกต้อง'} · ${v.warnings.length} รายการรอตรวจ</p>${v.errors.length?`<ul class="warning">${v.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<ul>${v.warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="small" style="margin-top:13px">หน้านี้บันทึกได้เฉพาะร่างในเครื่อง ส่งออกไฟล์ให้ทีมตรวจได้ แต่ยังไม่ขึ้นเว็บจริง</p>`;
}
function previewProduct() {
 const p=data.products.find(p=>p.id===editorId), frame=$('#preview'); if(!frame)return;
 const bg={plantman:'#e7c779',ozmo:'#c7d7eb',lazybug:'#eac9d8'}[p.theme];
 frame.srcdoc=`<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:26px;background:#f7f4eb;color:#203a30;font:16px/1.7 system-ui,sans-serif}*{box-sizing:border-box}.stage{background:${bg};border-radius:8px;height:320px;display:grid;place-items:center}.stage img{width:100%;height:100%;max-height:320px;object-fit:contain}h1{font-size:34px;line-height:1.25;margin:18px 0 10px}p{color:#607067}small{font-size:11px}.note{border-top:1px solid #cfd5c8;padding-top:15px}dl>div{display:flex;gap:18px;margin:10px 0;font-size:14px}dt{min-width:80px}dd{margin:0}button{background:#203a30;color:#fff;border:0;border-radius:6px;padding:12px 19px} @media(min-width:650px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.stage{height:550px}.stage img{max-height:500px}}</style><small>ตัวอย่างในเครื่อง · ${p.visible?'แสดงสินค้า':'ซ่อนจากแคตตาล็อก'}</small><div class="grid"><div class="stage"><img src="${p.image}" alt="${esc(p.alt)}"></div><div><small>${esc(p.profile)}</small><h1>${esc(p.name)}</h1><p>${esc(p.notes)}</p><p>${esc(p.description)}</p><dl><div><dt>ราคา</dt><dd>${esc(formatPrice(p))}</dd></div><div><dt>ขนาด</dt><dd>${esc(p.sizes||'ดูขนาดที่ Shopee')}</dd></div><div><dt>การบด</dt><dd>${esc(p.grinding||'สอบถามร้าน')}</dd></div></dl><button disabled>ตัวอย่างปุ่ม Shopee</button><p class="note"><small>ยังไม่ขึ้นเว็บจริง</small></p></div></div></html>`;
}
function studio() {
 title('แก้ข้อความและรูป'); const p=data.products.find(p=>p.id===editorId)||data.products[0]; editorId=p.id;
 return `<div class="studio-head"><div><span class="eyebrow">BREWTANIST / CONTENT STUDIO</span><h1>แก้ข้อความและรูป<br>ดูตัวอย่างได้เลย</h1><p>เลือกสินค้าที่จะแก้ แล้วดูผลด้านข้าง ร่างจะเก็บในเบราว์เซอร์นี้ ยังไม่ขึ้นเว็บจริง</p></div><span class="status-pill">ร่างในเครื่องนี้</span></div><div class="studio-layout"><section class="editor-panel"><h2>ข้อมูลสินค้า</h2><label class="field">เลือก Blend<select id="edit-product">${data.products.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="editor-check"><input type="checkbox" data-field="visible" ${p.visible?'checked':''}>แสดงสินค้านี้</label>${field('name','ชื่อสินค้า',p.name)}${field('profile','ชนิด / ระดับคั่ว',p.profile)}${field('notes','กลิ่นรส / Tasting notes',p.notes)}${field('description','คำอธิบาย',p.description,'textarea')}<label class="field">เปลี่ยนรูปสินค้า<input type="file" id="image-upload" accept="image/png,image/jpeg,image/webp"><small>JPG / PNG / WebP ไม่เกิน 8 MB · รูปจะถูกย่อและเก็บในเครื่อง ไม่อัปโหลดขึ้นเว็บ</small></label>${field('alt','คำอธิบายรูป',p.alt)}<label class="field">พื้นหลังสินค้า<select data-field="theme"><option value="plantman" ${p.theme==='plantman'?'selected':''}>เหลือง Plantman</option><option value="ozmo" ${p.theme==='ozmo'?'selected':''}>ฟ้า Ozmo</option><option value="lazybug" ${p.theme==='lazybug'?'selected':''}>ชมพู Lazybug</option></select></label><details><summary>ราคา ขนาด และลิงก์สินค้า</summary>${field('price','ราคา (บาท)',p.price,'input','เว้นว่างได้ · ราคาในต้นแบบไม่ใช่รายการขายจริง')}${field('sizes','ขนาดที่ขายจริง',p.sizes)}${field('grinding','ตัวเลือกการบดที่ร้านให้บริการ',p.grinding)}${field('origin','แหล่งปลูก / ส่วนผสม Blend ที่ยืนยันแล้ว',p.origin)}${field('productUrl','ลิงก์สินค้ารายตัวบน Shopee',p.productUrl,'input','ใช้ https://shopee.co.th/... เท่านั้น')}</details><details><summary>ตั้งค่าตัวช่วยเลือกกาแฟ</summary><p class="small">เลือกกลิ่นรสและรูปแบบการดื่มของตัวนี้ ระบบจะใช้จับคู่กับคำตอบลูกค้า ตรวจให้ตรงกับกาแฟก่อนบันทึก</p>${['chocolate','sweet','fruity'].map(k=>`<label class="editor-check"><input type="checkbox" data-tag="tasteTags" value="${k}" ${p.tasteTags.includes(k)?'checked':''}>${labels[k]}</label>`).join('')}${['black','milk'].map(k=>`<label class="editor-check"><input type="checkbox" data-tag="drinkTags" value="${k}" ${p.drinkTags.includes(k)?'checked':''}>แนะนำสำหรับ${labels[k]}</label>`).join('')}<label class="editor-check"><input type="checkbox" data-field="verified" ${p.verified?'checked':''}>ตรวจข้อมูลและคำแนะนำของตัวนี้แล้ว</label></details><details><summary>แก้หัวเรื่องหน้าแคตตาล็อก</summary><label class="field">หัวเรื่อง<textarea data-global="title">${esc(data.title)}</textarea></label><label class="field">คำแนะนำ<textarea data-global="intro">${esc(data.intro)}</textarea></label></details><div class="divider"></div><div class="actions"><button class="btn" data-action="save-draft">บันทึกร่างในเครื่อง</button><a class="text-link" href="#/product/${esc(p.id)}">เปิดหน้าตัวอย่าง ↗</a></div><p class="fineprint" id="save-status">${persistence?'เก็บร่างอัตโนมัติในเบราว์เซอร์นี้':'บันทึกในเครื่องไม่ได้ กดเก็บไฟล์ร่างก่อนปิดหน้านี้'}</p><div class="studio-bottom"><button class="btn small light" data-action="export-json">เก็บไฟล์ร่าง</button><button class="btn small light" data-action="export-html">โหลดเว็บตัวอย่าง</button></div><label class="field" style="margin-top:17px">เปิดไฟล์ร่างที่เก็บไว้ (.json)<input type="file" id="import-json" accept="application/json,.json"></label><button class="text-link warning" data-action="reset-draft">กลับไปใช้ข้อมูลเริ่มต้น</button></section><section class="preview-pane"><div class="preview-toolbar"><span>ตัวอย่างหน้าสินค้า · ยังไม่เผยแพร่</span><div class="filters"><button class="chip" data-device="desktop" aria-pressed="true">Desktop</button><button class="chip" data-device="mobile" aria-pressed="false">Mobile</button></div></div><iframe id="preview" class="preview-frame" title="ตัวอย่างหน้าสินค้าที่กำลังแก้" sandbox=""></iframe><div class="validation" id="validation"></div><div class="pending"><strong>บันทึกร่าง ไม่ใช่เผยแพร่</strong>กด “เก็บไฟล์ร่าง” เพื่อส่งให้ทีมตรวจ หรือ “โหลดเว็บตัวอย่าง” เพื่อเปิดดูพร้อมรูป ไม่ต้องใส่รหัสผ่านในหน้านี้</div></section></div>`;
}
function notFound() { title('ไม่พบหน้า'); return `<div class="not-found"><h1>ไม่พบสินค้านี้</h1><p>สินค้านี้อาจถูกซ่อนไว้ ลองกลับไปดูกาแฟทั้งหมด</p><a class="btn" href="#/catalog">กลับไปเลือกกาแฟ</a></div>`; }
function render(scroll=true) {
 const r=route();
 $('#app').innerHTML=r[0]==='catalog'?catalog():r[0]==='product'?detail(r[1]):r[0]==='finder'?finder():r[0]==='compare'?compare():r[0]==='studio'?studio():notFound();
 document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===r[0])a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(r[0]==='catalog')catalogueCards();
 if(r[0]==='studio'){previewProduct();renderValidation();}
 dock();
 if(scroll){window.scrollTo(0,0);$('#app').focus({preventScroll:true});}
}
function download(name,body,type) { const url=URL.createObjectURL(new Blob([body],{type})); const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }
function exportJson() { try { const clean=checked(data); download('brewtanist-draft.json',JSON.stringify(clean,null,2),'application/json');toast('เก็บไฟล์ร่างแล้ว'); } catch(e){toast(e.message);} }
function exportHtml() {
 try { const clean=checked(data), doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(clean).replace(/</g,'\\u003c');doc.querySelector('#app').innerHTML='';doc.querySelector('#dock').innerHTML='';doc.querySelector('#toast').textContent='';doc.querySelector('body').dataset.snapshot='true';doc.querySelector('#zoom').removeAttribute('open');download('brewtanist-preview.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('โหลดเว็บตัวอย่างพร้อมรูปแล้ว'); } catch(e){toast(e.message);}
}
$('#app').addEventListener('click',e=>{
 const jump=e.target.closest('[data-scroll]');if(jump){e.preventDefault();document.getElementById(jump.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return;}
 const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===f)));catalogueCards();return;}
 const answer=e.target.closest('[data-answer]');if(answer){quiz.answers[quiz.step]=answer.dataset.answer;render(false);return;}
 const zoom=e.target.closest('[data-zoom]');if(zoom){const p=product(zoom.dataset.zoom);$('#zoom-image').src=p.image;$('#zoom-image').alt=p.alt;$('#zoom').showModal();return;}
 const remove=e.target.closest('[data-remove]');if(remove){selected.delete(remove.dataset.remove);render(false);return;}
 const dev=e.target.closest('[data-device]');if(dev){$('#preview').classList.toggle('mobile',dev.dataset.device==='mobile');document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b===dev)));return;}
 const act=e.target.closest('[data-action]');if(!act)return;
 switch(act.dataset.action){
 case 'reset-filter':filter='all';search='';render(false);break;
 case 'quiz-next':if(quiz.answers[quiz.step]){quiz.step=Math.min(3,quiz.step+1);render(false);}break;
 case 'quiz-back':quiz.step=Math.max(0,quiz.step-1);render(false);break;
 case 'quiz-reset':quiz={step:0,answers:[]};render(false);break;
 case 'save-draft':try{checked(data);saveDraft();toast(persistence?'บันทึกร่างแล้ว · ยังไม่ขึ้นเว็บจริง':'บันทึกในเครื่องไม่ได้ กดเก็บไฟล์ร่างแทน');}catch(err){toast(err.message);}break;
 case 'export-json':exportJson();break;
 case 'export-html':exportHtml();break;
 case 'reset-draft':if(confirm('กลับไปใช้ข้อมูลเริ่มต้นทั้งสามตัว? ข้อความและรูปที่แก้ไว้จะหาย กดเก็บไฟล์ร่างไว้ก่อนถ้ายังต้องการใช้')){data=clone(DEFAULT);saveDraft();render(false);toast('คืนค่าต้นฉบับแล้ว');}break;
 }
});
$('#dock').addEventListener('click',e=>{if(e.target.closest('[data-action="clear-compare"]')){selected.clear();render(false);}});
$('#zoom').addEventListener('click',e=>{if(e.target===$('#zoom')||e.target.closest('[data-action="close-zoom"]'))$('#zoom').close();});
function edited() { const p=data.products.find(x=>x.id===editorId);p.verified=false;saveDraft();previewProduct();renderValidation();const status=$('#save-status');if(status)status.textContent=persistence?'เก็บร่างแล้ว · ยังไม่ขึ้นเว็บจริง':'ยังเก็บถาวรไม่ได้ กรุณาส่งออกไฟล์'; }
$('#app').addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='search'){search=el.value;catalogueCards();return;}
 if(el.dataset.field && !['checkbox','file'].includes(el.type) && el.tagName!=='SELECT') {data.products.find(x=>x.id===editorId)[el.dataset.field]=el.value;edited();}
 if(el.dataset.global){data[el.dataset.global]=el.value;saveDraft();renderValidation();}
});
$('#app').addEventListener('change',async e=>{
 const el=e.target;
 if(el.dataset.compare){if(el.checked)selected.add(el.dataset.compare);else selected.delete(el.dataset.compare);dock();return;}
 if(el.id==='edit-product'){editorId=el.value;render(false);return;}
 if(el.dataset.field && (el.type==='checkbox'||el.tagName==='SELECT')) {const p=data.products.find(x=>x.id===editorId);p[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.field!=='verified')p.verified=false;saveDraft();previewProduct();renderValidation();return;}
 if(el.dataset.tag){const p=data.products.find(x=>x.id===editorId),set=new Set(p[el.dataset.tag]);if(el.checked)set.add(el.value);else set.delete(el.value);p[el.dataset.tag]=[...set];edited();return;}
 if(el.id==='import-json'){
  const file=el.files[0];if(!file)return;
  try{if(file.size>16_000_000)throw new Error('ไฟล์ร่างใหญ่เกิน 16 MB');const loaded=checked(JSON.parse(await file.text()));if(!confirm('นำเข้าไฟล์ร่างแทนข้อมูลที่กำลังแก้ในเครื่องนี้?'))return;data=loaded;saveDraft();render(false);toast('เปิดไฟล์ร่างแล้ว · ยังไม่ขึ้นเว็บจริง');}catch(err){toast('นำเข้าไม่สำเร็จ: '+err.message);}return;
 }
 if(el.id==='image-upload'){
  const file=el.files[0];if(!file)return;
  try{
   if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8_000_000)throw new Error('เลือกรูป JPG/PNG/WebP ไม่เกิน 8 MB');
   const bitmap=await createImageBitmap(file);if(bitmap.width*bitmap.height>40_000_000){bitmap.close();throw new Error('รูปมีจำนวนพิกเซลสูงเกินไป');}
   const scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
   data.products.find(x=>x.id===editorId).image=canvas.toDataURL('image/webp',.86);edited();toast('เปลี่ยนรูปในร่างแล้ว');
  }catch(err){toast(err.message);}
 }
});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();document.getElementById('app').focus();});
window.addEventListener('hashchange',()=>render());
window.BrewtanistPreview={rank:answers=>rank(answers).map(x=>({id:x.p.id,score:x.score,reasons:x.reasons})),validate:()=>validation(),reset:()=>{data=clone(DEFAULT);quiz={step:0,answers:[]};selected.clear();saveDraft();render(false);},getData:()=>clone(data)};
render(false);
})();
</script>
</body>
</html>
