name: Security checks and source backup
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '10 20 * * 0'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history and files with checksum-verified Gitleaks
        run: python3 tools/scan_secrets.py
  backup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Back up source and verify a fresh restore
        shell: bash
        run: |
          git bundle create "$RUNNER_TEMP/website-source.bundle" --all
          git bundle verify "$RUNNER_TEMP/website-source.bundle"
          git clone --mirror "$RUNNER_TEMP/website-source.bundle" "$RUNNER_TEMP/restored.git"
          test "$(git rev-parse HEAD)" = "$(git --git-dir="$RUNNER_TEMP/restored.git" rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-source-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/website-source.bundle
          retention-days: 30
          if-no-files-found: error

