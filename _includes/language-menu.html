{%- assign active_language = site.data.languages[lang] -%}
<details class="language-menu" data-language-menu>
  <summary aria-label="{{ ui.language | escape }} · {{ active_language.name }}">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
    <span>{{ active_language.short }}</span><span class="language-caret" aria-hidden="true"></span>
  </summary>
  <nav aria-label="{{ ui.language | escape }}">
    {%- for entry in site.data.languages %}
    {%- assign choice = entry[1] %}
    <a href="{{ choice.prefix | append: page.section_path }}" lang="{{ choice.tag }}" hreflang="{{ choice.tag }}"{% if entry[0] == lang %} aria-current="page"{% endif %}>{{ choice.name }}</a>
    {%- endfor %}
  </nav>
</details>
