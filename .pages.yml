# Preview-branch configuration only. Do not copy this file onto main.
# All editable content is under prototype/. No production publish action is exposed.
settings:
  content:
    merge: true
  commit:
    templates:
      update: "Save Brewtanist preview copy: {path}"
content:
  - name: preview_copy
    label: "ร่างเว็บใหม่ · แก้ข้อความ"
    type: file
    path: prototype/copy.th.json
    format: json
    fields:
      - name: title
        label: "หัวเรื่องหน้าแรก"
        type: text
        required: true
        description: "ขึ้นบรรทัดใหม่ได้ ข้อความนี้เปลี่ยนเฉพาะเว็บตัวอย่าง"
        options: { maxlength: 160 }
      - name: intro
        label: "คำแนะนำใต้หัวเรื่อง"
        type: text
        required: true
        options: { maxlength: 2000 }
      - name: sourceDescription
        label: "ข้อความส่วนเลือกกาแฟกลับบ้าน"
        type: text
        required: true
        options: { maxlength: 2000 }
      - name: descriptions
        label: "คำอธิบายกาแฟ"
        type: object
        fields:
          - name: plantman
            label: "Mr. Plantman"
            type: text
            required: true
            options: { maxlength: 2000 }
          - name: ozmo
            label: "Mr. Ozmo"
            type: text
            required: true
            options: { maxlength: 2000 }
          - name: lazybug
            label: "Ms. Lazybug"
            type: text
            required: true
            options: { maxlength: 2000 }
      - name: revision
        label: "รุ่นข้อความตั้งต้น"
        type: number
        readonly: true
      - name: editorial_notes
        label: "ขอบเขตข้อมูลที่ใช้"
        type: text
        readonly: true
