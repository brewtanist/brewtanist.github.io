name: Check prototype review links
on:
  push:
    branches: ['preview/brewtanist-lab-20261108']
    paths: ['.github/workflows/prototype-link-check.yml']
permissions:
  contents: write
jobs:
  check:
    if: github.ref == 'refs/heads/preview/brewtanist-lab-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/brewtanist-lab-20261108
          fetch-depth: 0
      - name: Verify standalone HTML separately from optional screenshots
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import urlopen, Request
          REV='7127269dcf214aafbde04680c70868518f65a4de'
          bases=[f'https://rawcdn.githack.com/brewtanist/brewtanist.github.io/{REV}/prototype/', f'https://raw.githack.com/brewtanist/brewtanist.github.io/{REV}/prototype/']
          expected=Path('prototype/dist/index.html').read_bytes()
          reports=[]
          def request(url):
              return urlopen(Request(url,headers={'User-Agent':'BrewtanistPreviewCheck/1.0'}),timeout=30)
          for base in bases:
              row={'preview_url':base+'dist/index.html','html_check':'FAIL','screenshots':[]}
              try:
                  with request(row['preview_url']) as r:
                      body=r.read()
                      row.update(status=r.status,content_type=r.headers.get('content-type'),bytes=len(body))
                      assert r.status==200 and 'text/html' in row['content_type']
                      assert hashlib.sha256(body).digest()==hashlib.sha256(expected).digest(), 'HTML differs from tested standalone artifact'
                      row.update(html_check='PASS',matches_tested_artifact=True,sha256=hashlib.sha256(body).hexdigest())
              except Exception as e:
                  row.update(html_error=str(e))
              for image in ['01-catalog-desktop.png','04-content-studio.png','05-catalog-mobile.png']:
                  u=base+'qa/'+image
                  shot={'url':u}
                  try:
                      with request(u) as r:
                          assert r.status==200 and r.headers.get('content-type','').startswith('image/')
                          assert r.read(8)==b'\x89PNG\r\n\x1a\n'
                          shot.update(check='PASS',status=r.status)
                  except Exception as e:
                      shot.update(check='FAIL',error=str(e))
                  row['screenshots'].append(shot)
              reports.append(row)
          report={'results':reports,'note':'HTML and optional screenshot delivery are checked independently. The standalone HTML embeds all owned images; it does not load these screenshot files. These are HTTP byte-integrity checks, not a remote-browser test. A human browser may see the preview provider confirmation screen. This third-party review URL is not the production website.'}
          Path('prototype/qa/preview-url-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if not any(r['html_check']=='PASS' for r in reports):
              print('Public HTML preview unavailable; use the downloadable standalone artifact.')
          PY
      - name: Save verification report on preview branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/preview/brewtanist-lab-20261108'
          git diff --exit-code origin/main -- index.html _data .pages.yml _config.yml brewtanist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/qa/preview-url-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record standalone preview integrity and optional screenshot checks [skip ci]'
            git push origin HEAD:refs/heads/preview/brewtanist-lab-20261108
          fi
