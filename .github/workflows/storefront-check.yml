name: Verify Brewtanist Jekyll storefront

on:
  push:
    branches: [feature/shopee-storefront-20261109, qa/pages-cms-owner-check, main]
    paths:
      - '.pages.yml'
      - '_data/**'
      - 'en/**'
      - 'zh/**'
      - 'admin/**'
      - 'tools/verify_languages.py'
      - '_includes/**'
      - 'index.html'
      - 'shop/**'
      - 'oem/**'
      - 'brewtanist/**'
      - '_config.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'tools/test_public_index_controls.py'
      - 'tools/test_client_csp.py'
      - 'tools/test_storefront.py'
      - 'tools/test_favicon.py'
      - 'tools/test_hero_preload.py'
      - 'tools/test_shop_font_preloads.py'
      - 'tools/test_shop_filter_stability.py'
      - 'tools/test_site_name_breadcrumbs.py'
      - 'tools/test_shop_finder.py'
      - 'tools/test_analytics_consent.py'
      - 'tools/test_oem_form_layout.py'
      - 'tools/test_oem_retry_reference.py'
      - 'tools/test_oem_quote_handoff.py'
      - 'tools/test_oem_dom_injection.py'
      - 'tools/test_quote_model.mjs'
      - '.github/workflows/storefront-check.yml'
  pull_request:
    paths:
      - '_config.yml'
      - '.github/workflows/security.yml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'tools/test_public_index_controls.py'
      - 'tools/test_client_csp.py'
      - '_data/**'
      - '_includes/**'
      - 'index.html'
      - 'shop/**'
      - 'en/**'
      - 'zh/**'
      - 'tools/test_storefront.py'
      - 'tools/test_favicon.py'
      - 'tools/test_hero_preload.py'
      - 'tools/test_shop_font_preloads.py'
      - 'tools/test_shop_filter_stability.py'
      - 'tools/test_site_name_breadcrumbs.py'
      - 'tools/test_shop_finder.py'
      - 'tools/test_analytics_consent.py'
      - 'tools/test_oem_form_layout.py'
      - 'tools/test_oem_retry_reference.py'
      - 'tools/test_oem_quote_handoff.py'
      - 'tools/test_oem_dom_injection.py'
      - 'brewtanist/**'
      - 'tools/verify_languages.py'
      - '.github/workflows/storefront-check.yml'

permissions:
  contents: read

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the actual Jekyll pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Verify crawlability and noindex on public editing/quote pages
        run: python3 tools/test_public_index_controls.py _site
      - name: Verify early, least-privilege CSP and Referrer-Policy on 15 routes
        run: python3 tools/test_client_csp.py _site
      - name: Verify rendered products, Shopee links, assets and navigation
        run: python3 tools/test_storefront.py _site --report "$RUNNER_TEMP/brewtanist-storefront-report.json"
      - name: Verify site icon on all localized public routes
        run: python3 tools/test_favicon.py _site
      - name: Verify responsive hero preload markup and actual AVIF assets
        run: python3 tools/test_hero_preload.py _site
      - name: Verify desktop Shop font preloads without mobile duplicate loads
        run: python3 tools/test_shop_font_preloads.py _site
      - name: Verify brand site name and six localized breadcrumbs
        run: python3 tools/test_site_name_breadcrumbs.py _site
      - name: Write Shop photo gaps and source-date summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path(os.environ["RUNNER_TEMP"]) / "brewtanist-storefront-report.json"
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines = ["## Brewtanist Shop review", ""]
              if report.get("result") == "PASS":
                  lines += [
                      f"- Visible products: {report['visible_products']}",
                      f"- Products with local photos: {report['product_images']}",
                      f"- Missing product photos: {report['image_fallbacks']}",
                      f"- Shopee listing snapshot: {report.get('catalogue_snapshot_date') or 'not recorded'}",
                      "- **Live** Shopee prices, inventory, listing status and checkout are not checked by this workflow.",
                  ]
                  for product_id in report.get("photo_pending_ids", []):
                      lines.append(f"  - Needs approved photo: `{product_id}`")
              else:
                  lines.append(f"- Storefront validation: {report.get('result', 'not run')}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as target:
                  target.write("\n".join(lines) + "\n")
          PY
      - name: Check quote totals and negotiation revisions
        run: node --test tools/test_quote_model.mjs
      - name: Install Coffee Finder browser test tools
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Verify desktop filter strip stability and mobile wrapping
        run: python3 tools/test_shop_filter_stability.py _site
      - name: Check Coffee Finder in Thai, English and Chinese
        run: python3 tools/test_shop_finder.py _site --report "$RUNNER_TEMP/brewtanist-finder-report.json"
      - name: Verify favicon without default-icon console errors
        run: python3 tools/test_favicon.py _site --browser
      - name: Verify OEM initial form layout and no-JS fallback
        run: python3 tools/test_oem_form_layout.py _site
      - name: Verify OEM 409 preserves reference and 429 retries are safe
        run: python3 tools/test_oem_retry_reference.py _site
      - name: Verify customer RFQ receipt through offline quotation export in three languages
        run: python3 tools/test_oem_quote_handoff.py _site
      - name: Verify untrusted OEM fields and Quote Desk imports do not execute HTML
        run: python3 tools/test_oem_dom_injection.py _site
      - name: Block injected scripts while preserving OEM/Shop and admin workflows
        run: python3 tools/test_client_csp.py _site --browser
      - name: Confirm hero AVIF loads once in Chromium and WebKit
        run: python3 tools/test_hero_preload.py _site --browser
      - name: Confirm tracking is off in the published configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('_data/brewtanist/analytics.json').read_text())
          assert config == {'enabled': False, 'measurement_id': ''}, 'Do not activate tracking without owner approval and an ID'
          PY
          node --check brewtanist/analytics.js
          python3 tools/test_analytics_consent.py _site
      - name: Enable a fictional GA4 ID in a temporary test checkout only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = Path('_data/brewtanist/analytics.json')
          config.write_text(json.dumps({'enabled': True, 'measurement_id': 'G-TEST123456'}) + '\n')
          PY
      - name: Build isolated opt-in consent test pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site-analytics-preview
      - name: Verify no tracking before consent and safe events after
        run: python3 tools/test_analytics_consent.py _site-analytics-preview --enabled
      - name: Restore published analytics configuration
        if: always()
        run: git show HEAD:_data/brewtanist/analytics.json > _data/brewtanist/analytics.json
      - name: Hide optional homepage sections in the test checkout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for section in ("coffee", "gallery"):
              path = Path("_data/brewtanist") / (section + ".json")
              data = json.loads(path.read_text())
              data["visible"] = False
              path.write_text(json.dumps(data, ensure_ascii=False))
          PY
      - name: Rebuild with optional sections hidden
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Check links against the hidden-section build
        run: python3 tools/test_storefront.py _site
      - name: Preserve the validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brewtanist-storefront-validation
          path: |
            ${{ runner.temp }}/brewtanist-storefront-report.json
            ${{ runner.temp }}/brewtanist-finder-report.json
            qa/finder-mobile.png
            qa/finder-desktop.png
          retention-days: 30
