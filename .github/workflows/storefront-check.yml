name: Verify Brewtanist Jekyll storefront

on:
  push:
    branches: [feature/shopee-storefront-20261109, main]
    paths:
      - '_data/**'
      - 'en/**'
      - 'zh/**'
      - 'admin/**'
      - 'tools/verify_languages.py'
      - '_includes/**'
      - 'index.html'
      - 'shop/**'
      - 'oem/**'
      - 'brewtanist/**'
      - '_config.yml'
      - 'sitemap.xml'
      - 'tools/test_storefront.py'
      - 'tools/test_shop_finder.py'
      - 'tools/test_quote_model.mjs'
      - '.github/workflows/storefront-check.yml'
  pull_request:
    paths:
      - '_data/**'
      - '_includes/**'
      - 'index.html'
      - 'shop/**'
      - 'en/**'
      - 'zh/**'
      - 'tools/test_storefront.py'
      - 'tools/test_shop_finder.py'
      - 'brewtanist/**'
      - 'tools/verify_languages.py'
      - '.github/workflows/storefront-check.yml'

permissions:
  contents: read

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the actual Jekyll pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Verify rendered products, Shopee links, assets and navigation
        run: python3 tools/test_storefront.py _site --report "$RUNNER_TEMP/brewtanist-storefront-report.json"
      - name: Write Shop photo gaps and source-date summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path(os.environ["RUNNER_TEMP"]) / "brewtanist-storefront-report.json"
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines = ["## Brewtanist Shop review", ""]
              if report.get("result") == "PASS":
                  lines += [
                      f"- Visible products: {report['visible_products']}",
                      f"- Products with local photos: {report['product_images']}",
                      f"- Missing product photos: {report['image_fallbacks']}",
                      f"- Shopee listing snapshot: {report.get('catalogue_snapshot_date') or 'not recorded'}",
                      "- **Live** Shopee prices, inventory, listing status and checkout are not checked by this workflow.",
                  ]
                  for product_id in report.get("photo_pending_ids", []):
                      lines.append(f"  - Needs approved photo: `{product_id}`")
              else:
                  lines.append(f"- Storefront validation: {report.get('result', 'not run')}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as target:
                  target.write("\n".join(lines) + "\n")
          PY
      - name: Check quote totals and negotiation revisions
        run: node --test tools/test_quote_model.mjs
      - name: Install Coffee Finder browser test tools
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Check Coffee Finder in Thai, English and Chinese
        run: python3 tools/test_shop_finder.py _site --report "$RUNNER_TEMP/brewtanist-finder-report.json"
      - name: Hide optional homepage sections in the test checkout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for section in ("coffee", "gallery"):
              path = Path("_data/brewtanist") / (section + ".json")
              data = json.loads(path.read_text())
              data["visible"] = False
              path.write_text(json.dumps(data, ensure_ascii=False))
          PY
      - name: Rebuild with optional sections hidden
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Check links against the hidden-section build
        run: python3 tools/test_storefront.py _site
      - name: Preserve the validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brewtanist-storefront-validation
          path: |
            ${{ runner.temp }}/brewtanist-storefront-report.json
            ${{ runner.temp }}/brewtanist-finder-report.json
            qa/finder-mobile.png
            qa/finder-desktop.png
          retention-days: 30
