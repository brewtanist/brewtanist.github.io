<link rel="canonical" href="{{ page.url | absolute_url | escape }}">
{%- for entry in site.data.languages %}
  {%- assign alternate = entry[1] %}
  <link rel="alternate" hreflang="{{ alternate.tag }}" href="{{ alternate.prefix | append: page.section_path | absolute_url | escape }}">
  {%- unless entry[0] == lang %}
  <meta property="og:locale:alternate" content="{{ alternate.og }}">
  {%- endunless %}
{%- endfor %}
<link rel="alternate" hreflang="x-default" href="{{ page.section_path | absolute_url | escape }}">
