# Read-only performance baseline of the LIVE published site.
# Runs on PR to validate the audit setup and manually with Run workflow later.
# Not a Core Web Vitals field report; the data comes from simulated Lighthouse loads.
name: Audit Brewtanist public-site performance

on:
  pull_request:
    paths:
      - 'tools/audit_performance.py'
      - 'tools/summarize_performance_samples.py'
      - 'tools/test_performance_samples.py'
      - '.github/workflows/performance-baseline.yml'
  push:
    branches: [main]
    paths:
      - '_includes/shop-page.html'
      - '_includes/home-page.html'
      - 'favicon.ico'
      - 'favicon.svg'
      - '_includes/oem-form.html'
      - 'brewtanist/shop.css'
      - 'brewtanist/site.css'
      - '.github/workflows/performance-baseline.yml'
      - 'tools/audit_performance.py'
      - 'tools/summarize_performance_samples.py'
      - 'tools/test_performance_samples.py'
  # Weekly live diagnostics: Monday 09:00 Asia/Bangkok (02:00 UTC).
  # No external notification, private API, cookies or tracking added.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brew-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-lab:
    name: ${{ matrix.page }} / ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        page: [home, shop, oem]
        device: [mobile, desktop]
    steps:
      - name: Checkout audit script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify runner's installed Chrome and Node
        run: |
          node --version
          npm --version
          (google-chrome --version || google-chrome-stable --version)
      - name: Install pinned Lighthouse without updating site dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund lighthouse@13.6.0
      - name: Validate repeated-sample aggregation with offline fixtures
        if: ${{ matrix.page == 'oem' && matrix.device == 'mobile' }}
        run: python3 tools/test_performance_samples.py
      - name: Audit the live public URL (no private login, no cookies)
        run: |
          python3 tools/audit_performance.py --page '${{ matrix.page }}' --device '${{ matrix.device }}' --sample 1
      - name: Repeat OEM mobile samples for median and variance (weekly/manual only)
        if: ${{ matrix.page == 'oem' && matrix.device == 'mobile' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          python3 tools/audit_performance.py --page oem --device mobile --sample 2
          python3 tools/audit_performance.py --page oem --device mobile --sample 3
          python3 tools/summarize_performance_samples.py \
            qa/performance-lab/oem-mobile.summary.json \
            qa/performance-lab/oem-mobile.sample2.summary.json \
            qa/performance-lab/oem-mobile.sample3.summary.json \
            --output qa/performance-lab/oem-mobile.variability.json
      - name: Upload exact Lighthouse results and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighthouse-${{ matrix.page }}-${{ matrix.device }}
          path: |
            qa/performance-lab/${{ matrix.page }}-${{ matrix.device }}*.json
          if-no-files-found: warn
          retention-days: 30
