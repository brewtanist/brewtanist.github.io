name: Review dependency vulnerabilities
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 20 * * 0'
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate scanner failure and version resolution behavior
        run: python3 tools/audit_action_dependencies.py --self-test
      - name: Check direct action commits and verified release versions against OSV
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/audit_action_dependencies.py

