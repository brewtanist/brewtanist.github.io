name: Brewtanist design refinement checks
on:
  push:
    branches: ['design/brewtanist-refinement-20261109', 'main']
    paths: ['brewtanist/refinement.*', 'catalogue/refinement.*', 'tools/refine_site.py', 'tools/test_refinement.py', '.github/workflows/design-refinement.yml', 'index.html']
permissions:
  contents: read
concurrency:
  group: design-refinement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install browser engines and test tools
        run: |
          python3 -m pip install 'PyYAML==6.0.2' 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium webkit
      - name: Install design layer in temporary test workspace
        run: python3 tools/refine_site.py
      - name: Build customer catalogue using test-only origin
        run: |
          python3 -m py_compile tools/refine_site.py tools/test_refinement.py catalogue/refinement.py
          python3 catalogue/build.py --base-url https://catalogue-design.example.invalid
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Check mobile and desktop on Chromium and WebKit
        run: python3 tools/test_refinement.py
      - name: Build portable catalogue review
        run: python3 catalogue/make_review.py
      - name: Check portable review navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          with sync_playwright() as pw:
            b=pw.chromium.launch();p=b.new_page();errors=[];p.on('pageerror',lambda e:errors.append(str(e)))
            p.goto((Path.cwd()/'catalogue/review/index.html').as_uri(),wait_until='networkidle')
            frame=p.frame_locator('#frame');expect(frame.locator('.market-card')).to_have_count(17)
            frame.locator('a[href="/item/capsule-ozmo/"]').first.click();expect(p.frame_locator('#frame').locator('h1')).to_have_text('Mr. Ozmo · กาแฟแคปซูล')
            assert not errors,errors;b.close()
          print('Portable catalogue review navigation passed.')
          PY
      - name: Record exact presentation changes for publication
        run: |
          git diff -- index.html catalogue/build.py
          git diff --exit-code 6366d524adb0ed1ef1e499a0c150876d7e4844bd -- _data/brewtanist .pages.yml render.yaml _config.yml admin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brewtanist-design-refinement-evidence
          path: |
            qa/design-20261109/
            catalogue/review/index.html
            catalogue/dist/
            index.html
            catalogue/build.py
          retention-days: 30
