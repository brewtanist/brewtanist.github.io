name: Check prototype review links
on:
  push:
    branches: ['preview/brewtanist-lab-20261108']
    paths: ['.github/workflows/prototype-link-check.yml']
permissions:
  contents: write
jobs:
  check:
    if: github.ref == 'refs/heads/preview/brewtanist-lab-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/brewtanist-lab-20261108
          fetch-depth: 0
      - name: Verify standalone preview and screenshot URLs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen, Request
          REV='7127269dcf214aafbde04680c70868518f65a4de'
          bases=[f'https://rawcdn.githack.com/brewtanist/brewtanist.github.io/{REV}/prototype/', f'https://raw.githack.com/brewtanist/brewtanist.github.io/{REV}/prototype/']
          reports=[]
          for base in bases:
              row={'preview_url':base+'dist/index.html'}
              try:
                  with urlopen(Request(row['preview_url'],headers={'User-Agent':'BrewtanistPreviewCheck/1.0'}),timeout=35) as r:
                      body=r.read().decode('utf-8')
                      row.update(status=r.status,content_type=r.headers.get('content-type'),bytes=len(body.encode('utf-8')))
                      assert r.status==200 and 'text/html' in row['content_type']
                      assert 'BrewtanistPreview' in body and 'noindex,nofollow,noarchive' in body and '__CATALOG_JSON__' not in body
                      assert 'data:image/webp;base64,' in body
                  shots=[]
                  for image in ['01-catalog-desktop.png','04-content-studio.png','05-catalog-mobile.png']:
                      u=base+'qa/'+image
                      with urlopen(u,timeout=25) as r:
                          assert r.status==200 and r.headers.get('content-type','').startswith('image/')
                          assert r.read(8)==b'\x89PNG\r\n\x1a\n'
                          shots.append(u)
                  row.update(result='PASS',screenshots=shots)
              except Exception as e:
                  row.update(result='FAIL',error=str(e))
              reports.append(row)
          report={'results':reports,'note':'HTTP content checks; provider may show a confirmation screen in a human browser. Preview hosting is third-party, not the production website. No account/password is required.'}
          Path('prototype/qa/preview-url-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if not any(r['result']=='PASS' for r in reports):
              print('Public preview unavailable; the downloadable standalone artifact remains usable.')
          PY
      - name: Save verification report on preview branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/preview/brewtanist-lab-20261108'
          git diff --exit-code origin/main -- index.html _data .pages.yml _config.yml brewtanist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/qa/preview-url-report.json
          git commit -m 'Record prototype URL verification; production untouched [skip ci]'
          git push origin HEAD:refs/heads/preview/brewtanist-lab-20261108
