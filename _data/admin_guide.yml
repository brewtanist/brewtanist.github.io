th:
  tag: th
  home_url: /
  language: เลือกภาษา
  title: คู่มือแก้ไขเว็บไซต์
  heading: แก้ข้อความและรูปบนเว็บไซต์
  intro: แก้ข้อความภาษาไทย รูปสินค้า และข้อมูลร้านได้ใน Pages CMS เมื่อกดบันทึก GitHub Pages จะนำข้อมูลที่แก้ขึ้นเว็บไซต์
  open_editor: เปิด Pages CMS
  open_site: ดูเว็บไซต์
  setup_heading: เข้าสู่ระบบ Pages CMS
  steps:
    - 'เปิด Pages CMS แล้วเลือก <strong>Sign in with GitHub</strong> เข้าสู่ระบบด้วยบัญชี <code>pumplcrs-hub</code> หรือบัญชีที่มีสิทธิ์แก้ไขเว็บไซต์ของร้านบน GitHub'
    - 'เมื่อระบบขอติดตั้ง Pages CMS GitHub App ให้เลือก <strong>Only select repositories</strong> ในองค์กร <code>brewtanist</code> แล้วเลือก <code>brewtanist.github.io</code>'
    - 'เปิด <code>brewtanist/brewtanist.github.io</code> เลือกสาขา <strong>main</strong> และเปิดหมวดที่จะแก้'
    - 'ตรวจข้อความและรูปก่อนกด <strong>Save</strong> เมื่อบันทึกบนสาขา <code>main</code> แล้ว GitHub Pages จะเริ่มเผยแพร่'
  menu_heading: เลือกหมวดที่จะแก้
  section: หมวดใน CMS
  fields: ข้อมูลที่แก้ได้
  menus:
    - [หน้าบนและเรื่องราว, พาดหัว ข้อความแนะนำร้าน รูปหลัก ปุ่ม เรื่องของร้าน และรูปข้างข้อมูลติดต่อ]
    - [กาแฟและเบเกอรี่, ชื่อเมนู คำบรรยาย รูป และลำดับที่แสดง]
    - [สินค้าและภาพ 3D, ชื่อเบลนด์ กลิ่นรส ระดับการคั่ว รูปถุงกาแฟ และสีพื้นหลัง]
    - [เรื่องโรงคั่ว, ขั้นตอนการคั่วและภาพโรงคั่ว]
    - [แกลเลอรี, รูป คำบรรยาย และลำดับรูป รวมถึงเลือกรูปที่จะแสดง]
    - [คำถามที่พบบ่อย, คำถามและคำตอบเพิ่มเติม ส่วนที่อยู่และเวลาเปิดร้านดึงมาจากหมวดข้อมูลร้าน]
    - [ข้อมูลร้าน ลิงก์ และ SEO, ที่อยู่ เวลาเปิดร้าน เบอร์โทรศัพท์ วิธีชำระเงิน ลิงก์ และคำอธิบายที่แสดงในผลการค้นหา]
    - [สินค้าจาก Shopee, รายการสินค้า หมวดหมู่ รูป รายละเอียด และรหัสสินค้าที่ใช้เปิดหน้าสินค้าใน Shopee]
  translation_heading: แก้ข้อความให้ตรงกันทั้งสามภาษา
  translation_note: แก้ข้อความภาษาไทยของหน้าร้านใน Pages CMS ส่วนภาษาอังกฤษและภาษาจีนตัวย่อให้แก้ในไฟล์ของแต่ละภาษา เมื่อข้อมูลร้านเปลี่ยน ให้ตรวจทั้งสามภาษาอีกครั้ง
  en_file: เปิดไฟล์ภาษาอังกฤษ
  zh_file: เปิดไฟล์ภาษาจีนตัวย่อ
  image_heading: เปลี่ยนรูป
  image_notes:
    - 'เปิดช่องรูปในหมวดที่ต้องการ เลือกรูปจากคลังหรืออัปโหลดไฟล์ JPG, PNG หรือ WebP รูปใน <code>brewtanist/assets</code> เปิดดูได้สาธารณะ เลือกใช้รูปที่ร้านมีสิทธิ์เผยแพร่'
    - 'เมื่อเปลี่ยนรูป ให้ตั้งชื่อไฟล์ใหม่ก่อนอัปโหลด แล้วเลือกจุดที่ต้องการให้เห็นเมื่อรูปถูกครอป รูปถุงกาแฟจะแสดงเต็มใบ ส่วนการจัดรูปหลักไว้ด้านซ้ายหรือขวามีผลบนหน้าจอคอมพิวเตอร์'
    - 'เรียงรูปหรือรายการใหม่ได้ในหมวดนั้น หากต้องการซ่อนรูปที่ส่วนอื่นยังใช้อยู่ ให้ปิดสวิตช์ <strong>แสดง</strong>'
  publish_heading: ตรวจหน้าเว็บหลังบันทึก
  publish_text: 'เปิดงาน <strong>pages build and deployment</strong> ล่าสุดใน GitHub Actions เมื่อเผยแพร่เสร็จแล้ว ให้เปิดเว็บบนมือถือและคอมพิวเตอร์ ตรวจหน้าที่แก้และลองสลับภาษา'
  actions: ดูสถานะการเผยแพร่บน GitHub Actions
  history: ดูประวัติการแก้ไข
  recover: ถ้าเผยแพร่ไม่สำเร็จ ให้เปิดงานที่ขึ้นข้อผิดพลาดเพื่อดูสาเหตุ หากต้องการใช้ข้อมูลเดิม ให้เปิดประวัติไฟล์บน GitHub แล้วคัดลอกส่วนที่ต้องการกลับมาบันทึก
  docs: คู่มือเริ่มต้นของ Pages CMS
en:
  tag: en
  home_url: /en/
  language: Choose a language
  title: Website editing guide
  heading: Edit the website’s text and photos
  intro: Use Pages CMS to update the Thai text, product photos and café details. GitHub Pages publishes the changes you save.
  open_editor: Open Pages CMS
  open_site: View the website
  setup_heading: Sign in to Pages CMS
  steps:
    - 'In Pages CMS, choose <strong>Sign in with GitHub</strong>. Use <code>pumplcrs-hub</code> or another account with permission to edit the café’s repository.'
    - 'If GitHub asks you to install the Pages CMS app, choose the <code>brewtanist</code> organisation and <strong>Only select repositories</strong>. Select <code>brewtanist.github.io</code>.'
    - 'Open <code>brewtanist/brewtanist.github.io</code>, select the <strong>main</strong> branch and choose the section you want to edit.'
    - 'Check the text and photos, then choose <strong>Save</strong>. Saving to <code>main</code> starts the website update.'
  menu_heading: Where to make each change
  section: Section in Pages CMS
  fields: What you can edit
  menus:
    - ["Homepage and café story", "The headline, introduction, main photo, buttons, café story and photo beside the contact details."]
    - ["Coffee and baking", "The names, descriptions, photos and order of the menu cards."]
    - ["Products and 3D images", "Blend names, tasting notes, roast levels, bag images and background colours."]
    - ["Roastery", "The roasting process and the roastery photo."]
    - ["Gallery", "Photos, captions, their order and which photos appear on the site."]
    - ["Frequently asked questions", "Questions and answers. To change the address or opening hours, edit the café details."]
    - ["Café details, links and SEO", "Address, opening hours, phone number, payment methods, links and descriptions for search results."]
    - ["Shopee products", "Product cards, categories, photos, descriptions and the product IDs used in Shopee links."]
  translation_heading: Update the English and Simplified Chinese text
  translation_note: Edit the Thai text in Pages CMS. The files below contain the English and Simplified Chinese homepage and product descriptions. When café details change, check all three languages.
  en_file: English homepage and product text
  zh_file: Simplified Chinese homepage and product text
  image_heading: Replace or rearrange photos
  image_notes:
    - 'Open the image field in the section you want to edit. Choose an existing image or upload a JPG, PNG or WebP file. Photos in <code>brewtanist/assets</code> are public, so use images the café has permission to publish.'
    - 'Give a replacement photo a new filename. Choose which part to keep in view when the photo is cropped. Product renders show the whole coffee bag. On desktop, you can also place the homepage photo on the left or right.'
    - 'Drag photos or cards to change their order. To hide an image in one section and keep it available elsewhere, turn off its visibility in that section.'
  publish_heading: Check the live website
  publish_text: 'In GitHub Actions, open <strong>pages build and deployment</strong> for your latest change. Once it finishes successfully, check the site on a phone and a computer and try the language switcher.'
  actions: Check deployment status
  history: View changes on GitHub
  recover: If an update fails, open the failed job in GitHub Actions to see the error. To restore earlier text, open the file’s history on GitHub, copy the version you want and save your change.
  docs: Pages CMS quick-start guide
zh:
  tag: zh-Hans
  home_url: /zh/
  language: 选择语言
  title: 网站编辑指南
  heading: 编辑网站文字和图片
  intro: 用 Pages CMS 可以更新泰语文案、商品图片和门店信息。保存后，GitHub Pages 会重新生成并发布网站。
  open_editor: 打开 Pages CMS
  open_site: 查看网站
  setup_heading: 首次登录
  steps:
    - '打开 Pages CMS，点击 <strong>Sign in with GitHub</strong>，使用 <code>pumplcrs-hub</code> 或其他有权编辑门店仓库的 GitHub 账号登录。'
    - '如果系统提示安装 Pages CMS GitHub App，请在 <code>brewtanist</code> 组织下选择 <strong>Only select repositories</strong>，再选中 <code>brewtanist.github.io</code>。'
    - '打开 <code>brewtanist/brewtanist.github.io</code>，选择 <strong>main</strong> 分支，再进入要编辑的栏目。'
    - '核对文字和图片后点击 <strong>Save</strong>。保存到 main 分支即可触发发布。'
  menu_heading: 在哪里修改内容
  section: CMS 栏目
  fields: 可修改的内容
  menus:
    - [首页与门店故事, 首页标题、简介、主图、按钮、门店故事和联系方式旁的配图。]
    - [咖啡与自制点心, 菜单卡片的名称、说明、图片和排列顺序。]
    - [商品与 3D 效果图, 招牌拼配的名称、风味、烘焙程度、咖啡袋效果图和背景色。]
    - [烘焙工坊, 烘焙步骤和工坊照片。]
    - [相册, 照片、说明、排列顺序和显示设置。]
    - [常见问题, 补充问题与解答。地址和营业时间会从门店信息中自动读取。]
    - [门店信息、链接与搜索设置, 地址、营业时间、联系电话、付款方式、链接和搜索结果中显示的网站简介。]
    - [Shopee 商品, 商品卡片、分类、图片、详情，以及生成 Shopee 商品链接所需的商品编号。]
  translation_heading: 更新英文和简体中文内容
  translation_note: 泰语文案在 Pages CMS 中修改。英文和简体中文的首页文案及商品说明在下方文件中维护。门店信息有变动时，请在发布前核对三个语言版本。
  en_file: 打开英文文案
  zh_file: 打开简体中文文案
  image_heading: 更换图片
  image_notes:
    - '在相应栏目的图片选项中，可以从图库选图，也可以上传 JPG、PNG 或 WebP 文件。保存在 <code>brewtanist/assets</code> 中的图片会公开显示，请使用门店有权发布的图片。'
    - '替换旧图时，请用新文件名上传。可以选择裁切时保留的区域（中间、上方、下方、左侧或右侧）。咖啡袋效果图会完整显示。首页主图在电脑端还可以设为居左或居右。'
    - '拖动照片或卡片可以调整排列顺序。要在当前栏目隐藏其他地方还在使用的图片，关闭显示开关即可。'
  publish_heading: 检查发布结果
  publish_text: '打开 GitHub Actions，找到此次修改对应的 <strong>pages build and deployment</strong>。任务成功后，在手机和电脑上打开网站，切换语言检查内容。'
  actions: 查看 GitHub Actions 发布状态
  history: 查看修改记录
  recover: 如果发布失败，打开对应任务查看错误信息。要恢复某段旧文案，可以在 GitHub 的文件历史记录中找到旧版本，把需要的内容复制回来并保存。
  docs: Pages CMS 快速入门指南
