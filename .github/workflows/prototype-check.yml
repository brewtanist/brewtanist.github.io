name: Brewtanist prototype review

on:
  push:
    branches: ['preview/brewtanist-lab-20261108']
    paths:
      - 'prototype/template.html'
      - 'prototype/build.py'
      - 'prototype/test_preview.py'
      - 'prototype/copy.th.json'
      - 'prototype/refine_copy.py'
      - '.github/workflows/prototype-check.yml'

permissions:
  contents: write

concurrency:
  group: brewtanist-prototype-review
  cancel-in-progress: true

jobs:
  review:
    if: github.ref == 'refs/heads/preview/brewtanist-lab-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout prototype branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: preview/brewtanist-lab-20261108
      - name: Verify production has not changed
        run: |
          test "$GITHUB_REF" = 'refs/heads/preview/brewtanist-lab-20261108'
          git diff --exit-code origin/main -- index.html _data .pages.yml _config.yml brewtanist
      - name: Refine preview language without changing source facts
        run: |
          python3 prototype/refine_copy.py
          python3 -m py_compile prototype/refine_copy.py prototype/build.py prototype/test_preview.py
      - name: Build single-file prototype from saved brand assets
        run: python3 prototype/build.py
      - name: Install browser testing tools
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Exercise catalogue, finder, owner drafts and mobile layouts
        run: python3 prototype/test_preview.py
      - name: Upload review bundle and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brewtanist-preview-review
          path: |
            prototype/dist/
            prototype/qa/
            prototype/VOICE.md
          retention-days: 30
      - name: Save tested preview on prototype branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/preview/brewtanist-lab-20261108'
          git diff --exit-code origin/main -- index.html _data .pages.yml _config.yml brewtanist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/template.html prototype/build.py prototype/test_preview.py prototype/VOICE.md prototype/dist prototype/qa
          if ! git diff --cached --quiet; then
            git commit -m 'Save natural Thai preview, draft-preservation tests and screenshots [skip ci]'
            git push origin HEAD:refs/heads/preview/brewtanist-lab-20261108
          fi
          echo '## Brewtanist Preview 02 — natural Thai copy' >> "$GITHUB_STEP_SUMMARY"
          echo 'The catalogue, product pages, comparison, Coffee Finder and local editor now use direct conversational Thai.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source facts and production files are unchanged. Existing owner-written local drafts are preserved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production deployment, checkout, tracker or main-branch write was used.' >> "$GITHUB_STEP_SUMMARY"
